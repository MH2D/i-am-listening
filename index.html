<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FC9ZJRCHDV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-FC9ZJRCHDV');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I am listening — portraits & music from Morocco</title>
  <meta name="description"
    content="A photo-and-sound project. Portraits of people met during a trip in Morocco, each paired with a song they wanted to share." />

  <!-- Open Graph / social sharing -->
  <meta property="og:title" content="I am listening" />
  <meta property="og:description"
    content="Portraits of people met in Morocco, each paired with the music they wanted me to hear. A face and a song." />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Atmosphere: gallery lighting + film grain (decorative) -->
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Entrance placard -->
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="intro__card">
      <!-- <p class="kicker">Morocco</p> -->
      <h1 id="introTitle" class="intro__title">I am listening</h1>
      <p class="intro__lead">
        During a trip across Morocco, I met people and asked them what song they would like to share.
      </p>
      <p class="intro__body">
        I took a picture of that moment. Click on a portrait to see them and hear their song.
      </p>
      <button id="enterBtn" class="btn-enter" type="button">Enter the gallery</button>
    </div>
  </div>

  <!-- Header -->
  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" href="#" aria-label="I am listening — back to top">
        <!-- <span class="brand__kicker">Morocco</span> -->
        <span class="brand__title">I am listening</span>
      </a>
      <nav class="links" aria-label="Elsewhere">
        <button id="aboutBtn" class="iconlink" type="button" aria-label="About this project" title="About">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"
            aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" />
            <line x1="12" y1="11" x2="12" y2="16.5" />
            <circle cx="12" cy="7.5" r="0.9" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <a class="iconlink" href="https://www.instagram.com/mh2dphoto/" target="_blank" rel="noopener"
          aria-label="Instagram — mh2dphoto" title="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"
            aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
          </svg>
        </a>
        <a class="iconlink" href="https://open.spotify.com/playlist/44r0zLfRBNJaQTBqnOx2sv?si=32e94f79f049482a"
          target="_blank" rel="noopener" aria-label="Listen to the full playlist on Spotify" title="Spotify playlist">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"
            aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" />
            <path d="M7 9.3c3.2-0.9 6.8-0.6 9.6 1" />
            <path d="M7.6 12.4c2.6-0.7 5.6-0.5 7.9 0.9" />
            <path d="M8.2 15.3c2-0.5 4.3-0.4 6.1 0.7" />
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Gallery is rendered here -->
    <section id="gallery" class="gallery" aria-label="Portraits" aria-busy="true"></section>
  </main>

  <footer class="colophon">
    <p>Photographs &amp; project by <a href="https://www.instagram.com/mh2dphoto/" target="_blank"
        rel="noopener">MH2D</a>. Click any face to listen.</p>
  </footer>

  <!-- Enlarged portrait -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxName" hidden>
    <button id="lightboxClose" class="lightbox__close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"
        aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>
    <figure class="lightbox__figure">
      <img id="lightboxImg" class="lightbox__img" alt="" />
      <figcaption id="lightboxName" class="lightbox__name"></figcaption>
    </figure>
  </div>

  <!-- Audio player (revealed on first play) -->
  <audio id="audioPlayer" preload="metadata"></audio>
  <div id="player" class="player" hidden>
    <div class="player__inner">
      <div class="player__now">
        <img id="nowThumb" class="player__thumb" alt="" />
        <span class="player__eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>

      <button id="playToggle" class="player__btn" type="button" aria-label="Pause">
        <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1" />
          <rect x="14" y="5" width="4" height="14" rx="1" />
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z" />
        </svg>
      </button>

      <time id="currentTime" class="player__time">0:00</time>
      <input id="progressBar" class="player__seek" type="range" min="0" max="100" value="0" step="0.1"
        aria-label="Seek" />
      <time id="duration" class="player__time">0:00</time>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>

</html>
